[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "backup"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
csv = "1"
